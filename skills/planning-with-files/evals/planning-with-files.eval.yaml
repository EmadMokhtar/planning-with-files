# skill-lens eval cases for planning-with-files.
#
# Two cases. Run with and without the skill, five times each:
#   skill-lens run skills/planning-with-files --baseline none --repeat 5
#
# Every check here works under both a product runner (claude-code) and a
# framework runner (pydantic-ai), so the cases use file assertions and a
# judge, not tool names: the two runners spell their tools differently.

cases:
  # Mirrors Test 1, eval 1 (todo-cli) in docs/evals.md, with the same seven
  # assertions, so the numbers can be compared with that table. The skill
  # keeps the files either in a named plan directory, .planning/<date>-<slug>/
  # (whose name changes on every run), or in the project root (its legacy
  # layout). Each filename must have exactly one match across both places.
  # Checks are independent: files split across directories can still pass.
  - name: creates-the-three-files
    task: Build a Python CLI todo tool with persistence.
    workspace: {}
    assertions:
      - kind: file-produced
        file_glob: [task_plan.md, .planning/*/task_plan.md]
      - kind: file-produced
        file_glob: [findings.md, .planning/*/findings.md]
      - kind: file-produced
        file_glob: [progress.md, .planning/*/progress.md]
      - kind: regex
        value: "(?m)^## Goal"
        file_glob: [task_plan.md, .planning/*/task_plan.md]
      - kind: regex
        value: "(?m)^### Phase"
        file_glob: [task_plan.md, .planning/*/task_plan.md]
      - kind: contains
        value: "**Status:**"
        file_glob: [task_plan.md, .planning/*/task_plan.md]
      - kind: regex
        value: "(?m)^## Errors Encountered"
        file_glob: [task_plan.md, .planning/*/task_plan.md]
      # The contents, not only the files. findings.md must record something:
      # a bullet with text, or a table row under a header. The empty file
      # init-session.sh writes has only bare "-" bullets and header rows, and
      # runs that passed every check above still left it that way. SKILL.md
      # names no headings for findings.md ("Research, discoveries"), so any
      # section counts.
      - kind: regex
        value: "(?m)^[ \\t]*[-*][ \\t]+\\S|^\\|[ :|-]+\\|[ \\t]*\\n\\|[ \\t]*[^|\\s]"
        file_glob: [findings.md, .planning/*/findings.md]
    judge:
      artifacts:
        - glob: [progress.md, .planning/*/progress.md]
      rubric:
        - progress.md records at least one concrete action taken on the todo tool in this session, not only empty template fields such as "**Phase:**" or "**Started:**".

  # The skill's main claim: a fresh session resumes from the files an earlier
  # session wrote. Session 1 plans three phases and is told to stop after
  # phase 1. Session 2 has no conversation history, only the workspace, and
  # is told to do the next phase without being told which one it is. Every
  # check runs after session 2, so each looks for what only session 2 could
  # have done: phase 2 marked complete and phase 3 not. A file_glob must match
  # exactly one file, so a session 2 that starts a second plan instead of
  # continuing the first one fails too.
  - name: resumes-from-its-own-plan
    sessions:
      - >-
        Build a Python CLI todo tool with persistence, in three phases.
        Phase 1: design the storage format and the commands.
        Phase 2: implement add and list.
        Phase 3: implement done and delete.
        Do phase 1 only, then stop.
      - >-
        Continue the todo tool from where the last session stopped.
        Do the next phase only, then stop.
    workspace: {}
    assertions:
      # The Status line of the "### Phase 2" section, before the next "###"
      # heading, says complete.
      - kind: regex
        value: '(?ms)^### Phase 2\b(?:(?!^### ).)*?\*\*Status:\*\*[ \t]*complete\b'
        file_glob: [task_plan.md, .planning/*/task_plan.md]
      # Phase 3 was left for later: its Status line is pending or in_progress.
      - kind: regex
        value: '(?ms)^### Phase 3\b(?:(?!^### ).)*?\*\*Status:\*\*[ \t]*(?:pending|in_progress)\b'
        file_glob: [task_plan.md, .planning/*/task_plan.md]
    judge:
      artifacts:
        - glob: [progress.md, .planning/*/progress.md]
      rubric:
        - progress.md records concrete work on the add and list commands, such as files changed or commands run, not only empty template fields.
        - progress.md still records the phase 1 design work, before the add and list work, so the later session added to the same log rather than replacing it.
